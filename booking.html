
<!DOCTYPE html>
<html>
<head>
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>IPL Ticket Booking Form</h1>

    <form>

        <label>Name:</label>
        <input type="text" name="name" required minlength="3">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" name="phone" required
        pattern="[0-9]{10}" title="Enter a 10-digit phone number">
        <br><br>

        <label>Select Match:</label>
        <select name="match" required>
            <option value="">Choose Match</option>
            <option>RCB vs CSK</option>
            <option>MI vs RCB</option>
            <option>CSK vs MI</option>
        </select>
        <br><br>

        <label>Stand Category:</label>
        <select name="stand" required>
            <option value="">Choose Stand</option>
            <option>General</option>
            <option>Premium</option>
            <option>VIP</option>
        </select>
        <br><br>

        <label>Number of Tickets:</label>
        <input type="number" name="tickets" min="1" max="10" required>
        <br><br>

        <p>Additional Preferences:</p>

        <input type="radio" name="preference" value="Normal" checked>
        Normal Seating

        <input type="radio" name="preference" value="Near Boundary">
        Near Boundary

        <br><br>

        <input type="checkbox" name="terms" required>
        I agree to the booking terms.

        <br><br>

        <button type="submit">Book Tickets</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
